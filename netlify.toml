# Netlify build settings, kept in the repo so they can't drift in the dashboard.
# Netlify runs Next.js through its Next.js adapter (installed automatically).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9+.
  NODE_VERSION = "22"
  # These are public by design (they end up in the browser bundle), so Netlify's
  # secret scanner must not fail the build over them. The real secret,
  # SUPABASE_SERVICE_ROLE_KEY, is deliberately NOT listed and stays protected.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL"
