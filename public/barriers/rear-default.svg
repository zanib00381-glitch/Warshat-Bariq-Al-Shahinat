<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Rear under-run protection device (illustration)">
  <rect width="800" height="600" fill="#f4f6fa"/>
  <!-- ground -->
  <rect x="0" y="480" width="800" height="120" fill="#e3e8f0"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#c5cedb" stroke-width="3"/>
  <!-- trailer rear (doors) -->
  <rect x="200" y="70" width="400" height="290" rx="6" fill="#ffffff" stroke="#1f3a7a" stroke-width="6"/>
  <line x1="400" y1="76" x2="400" y2="354" stroke="#1f3a7a" stroke-width="4"/>
  <g stroke="#1f3a7a" stroke-width="5" stroke-linecap="round">
    <line x1="300" y1="100" x2="300" y2="330"/><line x1="500" y1="100" x2="500" y2="330"/>
  </g>
  <g fill="#1f3a7a"><rect x="380" y="200" width="12" height="40" rx="3"/><rect x="408" y="200" width="12" height="40" rx="3"/></g>
  <!-- body sill + lights -->
  <rect x="190" y="360" width="420" height="24" rx="4" fill="#1f3a7a"/>
  <rect x="210" y="330" width="44" height="18" rx="4" fill="#e03131"/>
  <rect x="546" y="330" width="44" height="18" rx="4" fill="#e03131"/>
  <!-- wheels (seen from behind) -->
  <g fill="#27364f" stroke="#1f3a7a" stroke-width="4">
    <rect x="215" y="384" width="62" height="92" rx="10"/><rect x="283" y="384" width="62" height="92" rx="10"/>
    <rect x="455" y="384" width="62" height="92" rx="10"/><rect x="523" y="384" width="62" height="92" rx="10"/>
  </g>
  <!-- REAR UNDER-RUN BAR (highlighted) -->
  <g>
    <rect x="330" y="384" width="16" height="50" fill="#d9480f"/>
    <rect x="454" y="384" width="16" height="50" fill="#d9480f"/>
    <rect x="210" y="430" width="380" height="30" rx="5" fill="#f76707" stroke="#d9480f" stroke-width="3"/>
    <g stroke="#ffffff" stroke-width="10" opacity=".85">
      <line x1="240" y1="460" x2="268" y2="430"/><line x1="300" y1="460" x2="328" y2="430"/>
      <line x1="360" y1="460" x2="388" y2="430"/><line x1="420" y1="460" x2="448" y2="430"/>
      <line x1="480" y1="460" x2="508" y2="430"/><line x1="540" y1="460" x2="568" y2="430"/>
    </g>
  </g>
  <rect x="264" y="512" width="272" height="46" rx="23" fill="#d9480f"/>
  <text x="400" y="542" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">REAR BARRIER</text>
</svg>
